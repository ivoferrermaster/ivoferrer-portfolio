<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trabajo seleccionado de Ivo Ferrer: sitios web a medida para marcas y empresas.">
    <title>Trabajo seleccionado · Ivo Ferrer</title>
    <link rel="icon" type="image/svg+xml" href="assets/logos/logoivo.svg">
    <link rel="preload" href="assets/fonts/WorkSans-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components/sidemenu/side-menu.css">
    <link rel="stylesheet" href="components/work-carousel/work-carousel.css">
    <link rel="stylesheet" href="components/work-views/work-views.css">
    <link rel="stylesheet" href="trabajo.css">
    <link rel="stylesheet" href="components/page-transition/page-transition.css">
    <!-- Sin defer: tiene que correr antes de que se pinte la página (ver el archivo) -->
    <script src="components/page-transition/PageTransition.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script src="components/sidemenu/SideMenu.js" defer></script>
    <script src="components/work-carousel/WorkCarousel.js" defer></script>
    <script src="components/work-views/WorkViews.js" defer></script>
    <script src="data/proyectos.js" defer></script>
    <script src="trabajo.js" defer></script>
</head>
<body class="work-page">
    <div class="page-transition" aria-hidden="true">
        <img class="page-transition__logo" src="assets/logos/logoivo.svg" alt="" draggable="false">
    </div>
    <a class="skip-link" href="#trabajo">Saltar al carrusel de proyectos</a>

    <header class="site-header">
        <a href="index.html" class="site-logo">
            <img src="assets/logos/logoivo.svg" alt="Ivo Ferrer, ir al inicio" class="site-logo__img">
        </a>

        <a class="work-close" href="#/" hidden>Cerrar proyecto</a>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu">
            <span class="menu-toggle__text" aria-hidden="true">Menu</span>
            <span class="menu-toggle__icon" aria-hidden="true"></span>
            <span class="visually-hidden">Menú</span>
        </button>
    </header>

    <div class="side-menu" id="main-menu" inert>
        <nav class="side-menu__panel" aria-label="Principal">
            <ul class="side-menu__list">
                <li><a class="side-menu__link" href="index.html#inicio">Inicio</a></li>
                <li><a class="side-menu__link" href="index.html#servicios">Servicios</a></li>
                <li><a class="side-menu__link" href="trabajo.html" aria-current="page">Trabajo</a></li>
                <li><a class="side-menu__link" href="index.html#sobre-mi">Sobre mí</a></li>
                <li><a class="side-menu__link" href="index.html#contacto">Contacto</a></li>
            </ul>

            <p class="side-menu__socials-title" id="side-menu-socials">Socials</p>
            <ul class="side-menu__socials" aria-labelledby="side-menu-socials">
                <li><a href="#">LinkedIn</a></li>
                <li><a href="#">WhatsApp</a></li>
            </ul>
        </nav>
    </div>

    <main id="trabajo" tabindex="-1">
        <h1 class="visually-hidden">Trabajo seleccionado</h1>

        <!-- El póster y los títulos los agrega components/work-carousel/WorkCarousel.js a partir de data/proyectos.js -->
        <section class="work-carousel" id="work-carousel" aria-roledescription="carrusel" aria-label="Proyectos destacados">
            <noscript>
                <ul class="work-fallback">
                    <li><a href="#/proyecto/ascanelli">Ascanelli</a></li>
                    <li><a href="#/proyecto/montecitos">Montecitos</a></li>
                    <li><a href="#/proyecto/enterlab">Enterlab</a></li>
                    <li><a href="#/proyecto/cpd">CPD</a></li>
                </ul>
            </noscript>

            <div class="work-controls" role="group" aria-label="Navegación del carrusel">
                <button class="work-arrow work-arrow--prev" type="button" aria-label="Proyecto anterior"></button>
                <button class="work-arrow work-arrow--next" type="button" aria-label="Proyecto siguiente"></button>
            </div>
            <p class="work-count" aria-hidden="true"></p>
            <!-- Anuncia el proyecto actual a los lectores de pantalla -->
            <p class="work-status visually-hidden" role="status"></p>
        </section>

        <!-- Ficha: se abre encima del carrusel con #/proyecto/<slug>.
             La completa components/work-views/WorkViews.js con el proyecto elegido. -->
        <article class="work-detail" id="work-detail" tabindex="-1" aria-labelledby="work-detail-title" hidden>
            <h2 class="work-detail__title" id="work-detail-title"></h2>
            <p class="work-detail__lead"></p>
            <dl class="work-detail__meta"></dl>
            <p class="work-detail__cta"></p>
            <figure class="work-detail__media"><img alt=""></figure>
            <a class="work-pn work-pn--prev" rel="prev"><span class="visually-hidden"></span></a>
            <a class="work-pn work-pn--next" rel="next"><span class="visually-hidden"></span></a>
        </article>
    </main>
</body>
</html>
